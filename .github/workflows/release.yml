name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Check tag matches version.py
        shell: bash
        run: |
          version=$(python -c "from version import __version__; print(__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version.py ($version)"
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt pyinstaller pytest

      # Exercises the real NSPasteboard; the Windows clipboard is not reachable from the hosted runner session
      - name: Clipboard round-trip tests
        if: runner.os == 'macOS'
        run: python -m pytest tests -v

      - name: Build macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon_mac.png --out build/icon.iconset/icon_${size}x${size}.png
            sips -z $((size*2)) $((size*2)) assets/icon_mac.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Build app
        run: pyinstaller --noconfirm universal_clipboard.spec

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          # Ad-hoc signature over the finished bundle; an invalid one makes macOS report the app as damaged
          codesign --force --deep --sign - "dist/Universal Clipboard.app"
          mkdir -p dist/dmg
          cp -R "dist/Universal Clipboard.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Universal Clipboard" -srcfolder dist/dmg -ov -format UDZO "dist/Universal-Clipboard-$APP_VERSION-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: dist/Universal-Clipboard-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum Universal-Clipboard-* > checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.txt <<'EOF'
          ## Instalace

          **Windows:** stáhni `Universal-Clipboard-Setup-*.exe` a spusť ho. Při prvním spuštění Windows může ukázat „Systém Windows ochránil počítač“ → *Další informace* → *Přesto spustit* (aplikace není podepsaná certifikátem).

          **macOS (Apple Silicon):** otevři Terminál a spusť:
          ```
          curl -fsSL https://raw.githubusercontent.com/Molyn597/universal-clipboard-sync/main/install_mac.sh | bash
          ```
          Příkaz stáhne nejnovější verzi, nainstaluje ji do Aplikací a spustí – bez varování Gatekeeperu.

          Pokud stáhneš `.dmg` ručně přes prohlížeč, macOS aplikaci zablokuje jako neověřenou. Pak po přetažení do Aplikací spusť v Terminálu:
          ```
          xattr -dr com.apple.quarantine "/Applications/Universal Clipboard.app"
          ```

          ## Párování
          Na prvním zařízení otevři **Zařízení → Kopírovat**, na druhém kód vlož do **Kód z jiného zařízení → Spárovat**. Obě zařízení musí být na stejné Wi-Fi.

          ## Aktualizace
          Nainstalovaná aplikace sama hlídá nové verze a nabídne tlačítko **Aktualizovat**.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Universal Clipboard $GITHUB_REF_NAME" \
            --notes-file notes.txt
